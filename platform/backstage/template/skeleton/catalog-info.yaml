apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: AI agent generated from the platform golden path
  annotations:
    github.com/project-slug: Kerman-Sanjuan/${{ values.name }}
  tags:
    - ai
    - ai-agent
  links:
    - title: Evaluation thresholds
      url: https://github.com/Kerman-Sanjuan/${{ values.name }}/blob/main/evals/thresholds.yaml
spec:
  type: ai-agent
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ai-platform
  # The catalog answers the only question that matters at scale: who do I call,
  # and what does this thing depend on. Both come from this file, not from a dashboard.
  #
  # `resource:default/gpt-4o-mini`, not `resource:ai-platform/...`: an entity reference is
  # kind:namespace/name, and the namespace is `default`. Writing the system where the
  # namespace goes creates a relation to an entity that does not exist, and the catalog
  # says so on the entity page.
  #
  # The model Resource is declared once, in the platform catalog. This file does not
  # declare it: a second copy collides with the first, and two locations for one entity is
  # not a catalogue, it is two.
  dependsOn:
    - resource:default/${{ values.model }}
