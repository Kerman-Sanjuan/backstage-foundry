name: evals

# This is the required check. Everything else in the workflow exists to keep it cheap.
#
# Running the gate on every push would be waste: the only commits that can change model
# behaviour are the ones that touch the prompt, the dataset, the thresholds or the code
# that reads them.

on:
  # Every pull request: this job is the required check on main, and a required check that
  # only runs on some paths leaves every other pull request stuck on "Expected". The step
  # below decides whether there is anything to measure.
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Run against the real deployment (requires Azure OIDC configured)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # federated credentials to Azure. There is no stored secret in this design.

jobs:
  gate:
    name: evaluation gate (replay)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope step diffs against the base branch, so it needs the history.
          fetch-depth: 0

      - name: Does this pull request touch the agent or the evals?
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^demo/ai-actas-bot/(agent|evals)/'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            {
              echo "## Evaluation gate: not applicable"
              echo
              echo "This pull request does not touch \`demo/ai-actas-bot/agent/\` or"
              echo "\`demo/ai-actas-bot/evals/\`, so there is nothing for the gate to measure."
              echo "It reports success on purpose: it is a required check, and a required"
              echo "check that never reports blocks every other pull request."
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.scope.outputs.run == 'true'
        run: pip install -r demo/ai-actas-bot/requirements.txt

      - name: Gate
        if: steps.scope.outputs.run == 'true'
        run: make demo

  # Same gate, real deployment, no fixtures. Manual on purpose: it costs money and it is
  # slow, so it does not belong on every pull request. It also needs Azure OIDC configured,
  # so it must not run on a plain dispatch: that would fail for reasons unrelated to the code.
  gate-live:
    name: evaluation gate (live)
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: foundry
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r demo/ai-actas-bot/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Gate against the deployment
        env:
          FOUNDRY_ENDPOINT: ${{ vars.FOUNDRY_ENDPOINT }}
          FOUNDRY_DEPLOYMENT: ${{ vars.FOUNDRY_DEPLOYMENT }}
          LIVE: "1"
        run: make demo LIVE=1
